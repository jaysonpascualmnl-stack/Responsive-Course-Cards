<!DOCTYPE html>
<html lang="en">
<head>
  <title>Responsive Course Cards</title>
  <style>
    .course-list {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px;
    }

    .course-card {
      flex: 1 1 220px;
      border: 1px solid black;
      border-radius: 8px;
      overflow: hidden;
    }

    .course-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .course-card h2 {
      font-size: 16px;
      padding: 10px;
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="course-list">

    <article class="course-card">
      <img src="https://wallpapers.com/images/featured/aesthetic-nature-background-dxhvdcplq0s02jat.jpg" alt="">
      <h2>Advance Problem Solving & Programming</h2>
    </article>

    <article class="course-card">
      <img src="https://cdn.wallpapersafari.com/61/80/Ak2VC0.jpg" alt="">
      <h2>Introduction to Human Computer Interaction</h2>
    </article>

    <article class="course-card">
      <img src="https://plus.unsplash.com/premium_photo-1673285285994-6bfff235db97?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8bmF0dXJlJTIwYWVzdGhldGljfGVufDB8fDB8fHww" alt="">
      <h2>Mathematics, Science & Technology</h2>
    </article>

    <article class="course-card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTup0P6gBcU7fdtT-0piiAS0J4rP56KI4RXWg&s" alt="">
      <h2>Purposive Communication</h2>
    </article>

    <article class="course-card">
      <img src="https://t3.ftcdn.net/jpg/09/03/25/62/360_F_903256253_MZlGTM8wPNZuQ9jE8kogIYicGL2L0QMk.jpg" alt="">
      <h2>Contemporary World</h2>
    </article>

    <article class="course-card">
      <img src="https://wallpapers.com/images/featured/aesthetic-nature-dxhvdcplq0s02jat.jpg" alt="">
      <h2>Web Development</h2>
    </article>

  </section>
</body>
</html>
